# Generated by Shipyard — laravel-legacy preset
services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - '.:/var/www/html'
            - './php.ini:/usr/local/etc/php/conf.d/zz-shipyard.ini:ro'
        depends_on:
            - mysql
            - redis
    nginx:
        image: 'nginx:alpine'
        ports:
            - '${APP_PORT:-{{APP_PORT}}}:80'
        volumes:
            - '.:/var/www/html'
            - './nginx.conf:/etc/nginx/conf.d/default.conf:ro'
        depends_on:
            - php
    mysql:
        image: 'mysql:{{MYSQL_VERSION}}'
        # {{MYSQL_PLATFORM}}
        ports:
            - '${FORWARD_DB_PORT:-{{FORWARD_DB_PORT}}}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-{{PROJECT_NAME}}}'
            MYSQL_USER: '${DB_USERNAME:-sail}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'mysql:/var/lib/mysql'
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-{{FORWARD_REDIS_PORT}}}:6379'
        volumes:
            - 'redis:/data'
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-{{FORWARD_MAILPIT_PORT}}}:8025'
            - '1025'
    # {{OPTIONAL_SERVICES}}
volumes:
    mysql:
        driver: local
    redis:
        driver: local
    # {{OPTIONAL_VOLUMES}}
